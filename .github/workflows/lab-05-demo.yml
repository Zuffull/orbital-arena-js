name: Verify and publish Lab 07
on: workflow_dispatch
permissions:
  contents: write
jobs:
  lab07:
    if: github.ref == 'refs/heads/lab-07-upload'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: upload
      - uses: actions/checkout@v4
        with:
          ref: main
          path: target
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: target/.nvmrc
      - name: Apply patch and run unit tests
        working-directory: target
        run: |
          grep -q 'npm run coverage' .github/workflows/typecheck.yml
          git apply --index --whitespace=fix ../upload/lab07-migration.patch
          sed -i 's/!!\*\*\//!**\//g' biome.json
          sed -i 's/=> expect(decodeInput(encodeInput(cmd))).toEqual(cmd))/=> { expect(decodeInput(encodeInput(cmd))).toEqual({ ...cmd }); })/' shared/protocol.test.mjs
          git add biome.json shared/protocol.test.mjs
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run coverage
          npm run build
      - name: Browser multiplayer check
        working-directory: target
