name: Validate and stage Lab 08
on: workflow_dispatch
permissions:
  contents: write
  packages: write
jobs:
  lab08:
    if: github.ref == 'refs/heads/lab-08-upload'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: upload
      - uses: actions/checkout@v4
        with:
          ref: main
          path: target
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: target/.nvmrc
      - name: Validate candidate, Docker and browser recovery
        working-directory: target
        run: |
          test -f .github/workflows/release.yml
          git apply --index --whitespace=fix ../upload/lab08-migration.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/rooms.ts')
          s = p.read_text()
          s = s.replace('constructor(name: string, logDir: string, private readonly maximum = 8) {\n    super();', 'private readonly maximum: number;\n\n  constructor(name: string, logDir: string, maximum = 8) {\n    super();\n    this.maximum = maximum;')
          s = s.replace('constructor(logDir: string, private readonly limit = 16, private readonly players = 8) { this.logDir = logDir; }', 'private readonly limit: number;\n  private readonly players: number;\n\n  constructor(logDir: string, limit = 16, players = 8) {\n    this.logDir = logDir;\n    this.limit = limit;\n    this.players = players;\n  }')
          p.write_text(s)
          PY
          git add server/rooms.ts
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run coverage
          npm run build
          docker build --build-arg BUILD_SHA="$(git rev-parse HEAD)" -t orbital-arena-test .
          bash scripts/check-container.sh orbital-arena-test "$(git rev-parse HEAD)" | tee "$RUNNER_TEMP/docker-lab08.log"
          npx playwright install chromium
          npm run test:e2e
      - name: Record demonstration and push candidate
        working-directory: target
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PORT=38663 node server/index.ts > "$RUNNER_TEMP/demo-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..50}; do if curl -fsS http://127.0.0.1:38663/ready; then break; fi; sleep .2; done
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          node scripts/record-release.mjs
          ffprobe -v error -show_entries format=duration -of default=nw=1 docs/lab-08-demo.mp4
          cat lab08-readme.md >> README.md
          git rm -f lab08-readme.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/lab-08-demo.mp4 package-lock.json
          git commit -m 'Lab 08: Containerize and document Orbital Arena release'
          candidate_sha="$(git rev-parse HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg BUILD_SHA="$candidate_sha" -t "$image:preview" .
          docker push "$image:preview"
          git push origin HEAD:refs/heads/main
