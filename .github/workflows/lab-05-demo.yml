name: Validate and stage Lab 08
on:
  workflow_dispatch:
    inputs:
      public_url:
        description: Leave empty for the staging build. For final tags, provide the verified public HTTPS URL.
        required: false
        type: string
permissions:
  contents: write
  packages: write
jobs:
  lab08:
    if: github.ref == 'refs/heads/lab-08-upload'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: upload
      - uses: actions/checkout@v4
        with:
          ref: main
          path: target
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: target/.nvmrc
      - name: Validate candidate, Docker and browser recovery
        if: inputs.public_url == ''
        working-directory: target
        run: |
          test -f .github/workflows/release.yml
          git apply --index --whitespace=fix ../upload/lab08-migration.patch
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run coverage
          npm run build
          docker build --build-arg BUILD_SHA="$(git rev-parse HEAD)" -t orbital-arena-test .
          bash scripts/check-container.sh orbital-arena-test "$(git rev-parse HEAD)" | tee "$RUNNER_TEMP/docker-lab08.log"
          npx playwright install chromium
          npm run test:e2e
      - name: Record demonstration and push candidate
        if: inputs.public_url == ''
        working-directory: target
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PORT=38663 node server/index.ts > "$RUNNER_TEMP/demo-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..50}; do if curl -fsS http://127.0.0.1:38663/ready; then break; fi; sleep .2; done
          node scripts/record-release.mjs
          ffprobe -v error -show_entries format=duration -of default=nw=1 docs/lab-08-demo.mp4
          cat lab08-readme.md >> README.md
          git rm -f lab08-readme.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/lab-08-demo.mp4 package-lock.json
          git commit -m 'Lab 08: Containerize and document Orbital Arena release'
          candidate_sha="$(git rev-parse HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg BUILD_SHA="$candidate_sha" -t "$image:preview" .
          docker push "$image:preview"
          git push origin HEAD:refs/heads/main
      - name: Add verified address and tag release
        if: inputs.public_url != ''
        working-directory: target
        env:
          PUBLIC_URL: ${{ inputs.public_url }}
        run: |
          [[ "$PUBLIC_URL" =~ ^https://[a-z0-9-]+\.onrender\.com$ ]]
          curl -fsS --retry 4 --max-time 45 "$PUBLIC_URL/health" | jq -e --arg sha "$(git rev-parse HEAD)" '.sha == $sha'
          curl -fsS "$PUBLIC_URL/ready"
          python3 - <<'PY'
          import os
          from pathlib import Path
          file = Path('README.md')
          text = file.read_text()
          url = os.environ['PUBLIC_URL']
          marker = '## Лабораторна 08. Публічна мережева гра\n'
          link = f'\n**[Відкрити Orbital Arena]({url})** · [Стан сервера]({url}/health)\n'
          assert marker in text
          file.write_text(text.replace(marker, marker + link, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Lab 08: Add verified HTTPS game address'
          git tag -a lab-08 -m 'Lab 08'
          git tag -a v1.0.0 -m 'Orbital Arena v1.0.0'
          git push --atomic origin HEAD:refs/heads/main refs/tags/lab-08 refs/tags/v1.0.0
