name: Verify and publish Lab 07
on: workflow_dispatch
permissions:
  contents: write
jobs:
  lab07:
    if: github.ref == 'refs/heads/lab-07-upload'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: upload
      - uses: actions/checkout@v4
        with:
          ref: main
          path: target
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: target/.nvmrc
      - name: Apply patch and run unit tests
        working-directory: target
        run: |
          grep -q 'npm run coverage' .github/workflows/typecheck.yml
          git apply --index --whitespace=fix ../upload/lab07-migration.patch
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run coverage
          npm run build
      - name: Browser multiplayer check
        working-directory: target
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Record both versions and run the load test
        working-directory: target
        run: |
          set -euo pipefail
          git worktree add --detach ../baseline lab-06
          (cd ../baseline && npm install --no-audit --no-fund && npm run build)
          start_server() {
            (cd "$1" && exec env PORT=38653 node server/index.ts) > "$RUNNER_TEMP/lab07-server.log" 2>&1 &
            server_pid=$!
            for i in {1..50}; do
              if curl --fail --silent http://127.0.0.1:38653/health; then return; fi
              sleep .1
            done
            cat "$RUNNER_TEMP/lab07-server.log"
            return 1
          }
          trap 'if [[ -n "${server_pid:-}" ]]; then kill "$server_pid" 2>/dev/null || true; fi; cat "$RUNNER_TEMP/lab07-server.log" 2>/dev/null || true' EXIT
          export ORIGIN=http://127.0.0.1:38653
          start_server ../baseline
          npm run profile -- docs/lab-07-before
          kill "$server_pid"
          wait "$server_pid"
          start_server .
          npm run profile -- docs/lab-07-after
          npm run load -- docs/lab-07-load.json
          node scripts/report.mjs
      - name: Publish commit and tag
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/lab-07-* package-lock.json
          git commit -m 'Lab 07: Test determinism and profile runtime performance'
          git tag -a lab-07 -m 'Lab 07'
          git push --atomic origin HEAD:refs/heads/main refs/tags/lab-07
