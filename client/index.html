<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101e34" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <title>Orbital Arena</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <h1>Orbital Arena</h1>
      <section id="loading" class="panel">
        <h2>Завантаження ресурсів</h2>
        <canvas id="loading-bar" width="640" height="24" role="progressbar"
          aria-label="Завантаження ресурсів" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></canvas>
        <p role="status">Після натискання завантажаться спрайти, звуки й арена.</p>
        <button id="load-start" type="button">Почати завантаження</button>
        <button id="load-cancel" type="button" hidden>Скасувати</button>
      </section>
      <section id="lobby" class="panel" hidden>
        <p id="lobby-notice" aria-live="polite"></p>
        <h2>Лобі</h2>
        <form>
          <label>Позивний <input name="player" maxlength="24" required /></label>
          <label>Кімната <select name="room" required></select></label>
          <button disabled>Увійти</button>
        </form>
        <p role="status"></p>
      </section>
      <section id="game" hidden>
      <header>
        <h2 id="room-title">Ігрова арена</h2>
        <button id="reset" type="button" hidden>Скинути позицію</button>
        <button id="leave" type="button">Вийти в лобі</button>
      </header>
      <section class="arena" aria-label="Космічна арена">
        <canvas id="arena" aria-label="Політ космічного корабля"></canvas>
        <div id="hud"></div>
        <div id="status"></div>
      </section>
      <div id="touch-controls" aria-label="Керування польотом">
        <button type="button" data-control="KeyA" aria-label="Ліворуч">←</button>
        <button type="button" data-control="KeyW" aria-label="Тяга">↑</button>
        <button type="button" data-control="KeyD" aria-label="Праворуч">→</button>
        <button type="button" data-control="Space">Вогонь</button>
        <button type="button" data-control="KeyH">Самонаведення</button>
      </div>
      <section id="network-panel" class="panel">
        <output id="netgraph" aria-label="Мережеві показники"></output>
        <label>Інтерполяція <input id="interpolation" type="range" min="35" max="250" value="100" /></label>
      </section>
      <section id="room-panel" class="panel">
        <h3>Чат кімнати</h3>
        <p id="room-state" role="status"></p>
        <p>Гравці: <span id="roster">—</span></p>
        <ol id="chat-messages" aria-live="polite"></ol>
        <form id="chat">
          <label>Повідомлення <input name="message" maxlength="240" required /></label>
          <button type="submit">Надіслати</button>
        </form>
        <p><a id="replay" hidden>Завантажити журнал NDJSON</a></p>
      </section>
      <footer><span><kbd>W</kbd> / <kbd>↑</kbd> тяга</span><span><kbd>A</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd> поворот</span><span><kbd>Space</kbd> постріл</span><span><kbd>H</kbd> самонаведення</span></footer>
      </section>
    </main>
    <script type="module" src="./src/entry.ts"></script>
  </body>
</html>
